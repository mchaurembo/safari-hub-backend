<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Safari Hub 360">
  <defs>
    <linearGradient id="bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9A2434"/>
      <stop offset="0.45" stop-color="#7D1B28"/>
      <stop offset="1" stop-color="#4A1018"/>
    </linearGradient>
    <linearGradient id="gold" x1="12" y1="10" x2="52" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0D06A"/>
      <stop offset="0.5" stop-color="#E8B923"/>
      <stop offset="1" stop-color="#D4A017"/>
    </linearGradient>
    <linearGradient id="shine" x1="16" y1="6" x2="40" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Soft outer glow plate -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="14" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
  <rect width="64" height="64" rx="16" fill="url(#shine)"/>

  <!-- Truck body -->
  <rect x="9" y="20" width="26" height="17" rx="3" fill="#FFF8E7"/>
  <path d="M35 25.5V37h19.5c1.2 0 2.2-.9 2.2-2.1V28.2c0-.7-.3-1.3-.9-1.7L47.2 22.6c-.4-.3-.8-.4-1.3-.4H35z" fill="#FFF8E7"/>
  <path d="M37.2 24.8h8.6c.4 0 .7.1 1 .4l5.4 3.8c.2.1.3.4.3.6V31H37.2z" fill="url(#gold)"/>

  <!-- Chassis -->
  <rect x="9" y="36.5" width="47.5" height="2.8" rx="1.2" fill="url(#gold)"/>

  <!-- Wheels -->
  <circle cx="19" cy="43.5" r="6.2" fill="#1A1214"/>
  <circle cx="19" cy="43.5" r="6.2" fill="none" stroke="url(#gold)" stroke-width="2"/>
  <circle cx="19" cy="43.5" r="2.4" fill="url(#gold)"/>
  <circle cx="46.5" cy="43.5" r="6.2" fill="#1A1214"/>
  <circle cx="46.5" cy="43.5" r="6.2" fill="none" stroke="url(#gold)" stroke-width="2"/>
  <circle cx="46.5" cy="43.5" r="2.4" fill="url(#gold)"/>

  <!-- Accent stripe on cargo -->
  <rect x="12" y="25" width="18" height="2.2" rx="1.1" fill="url(#gold)" opacity="0.85"/>
</svg>
